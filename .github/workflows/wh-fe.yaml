name: wh-fe-main

on:
  push:
    branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-22.04
    environment: production

    steps:
      - name: checkout scm
        uses: actions/checkout@v7

      - name: Build Image
        run: docker build -t ${{ vars.IMAGE }} .

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
        
      - name: Push Image
        run: docker push ${{ vars.IMAGE }}


  deploy:

    runs-on: ubuntu-22.04
    environment: production

    steps:
      - name: Deploy wayshubfe on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd compose/frontend
            docker compose pull
            docker compose down
            docker compose up -d
